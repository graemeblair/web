name: Build CV PDF

# Called by build-deploy.yml, which needs the PDF for the Pages artifact.
# Reusable rather than standalone: the CV source is generated from content/, so
# there is no longer a GraemeBlair-CV.tex path to trigger on, and the PDF is no
# longer committed anywhere -- it is uploaded as an artifact and bundled into
# the deploy.
on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: cv-pdf-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    # GraemeBlair-CV.tex is set in Hoefler Text and Monaco. Those are macOS
    # system fonts and are not redistributable, so they cannot be vendored into
    # this repository and installed on a Linux runner -- the build has to run on
    # macOS, where XeTeX picks them up from the system font book. Substituting
    # free lookalikes changes the typography of the published CV, so don't.
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      # The CV source is generated from content/*.yml, so it has to be built
      # before XeLaTeX can see it. build.py writes it to _site/, and the
      # pre-compile lint in sitegen/targets/latex.py runs as part of that --
      # catching an escaping bug in milliseconds, with a line number, rather
      # than four minutes later as a TeX stack trace or (worse) a PDF that
      # compiled successfully into math mode.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Generate the CV source
        run: |
          set -euo pipefail
          pip install -r requirements.txt
          python build.py
          cp _site/GraemeBlair-CV.tex .
          ls -l GraemeBlair-CV.tex

      - name: Install fonts bundled in this repository
        run: |
          set -euo pipefail
          mkdir -p "$HOME/Library/Fonts"
          shopt -s nullglob
          installed=0
          for font in .github/fonts/*.ttf .github/fonts/*.otf .github/fonts/*.ttc; do
            cp "$font" "$HOME/Library/Fonts/"
            echo "installed $(basename "$font")"
            installed=$((installed + 1))
          done
          echo "installed $installed bundled font file(s)"

      # Installing all of MacTeX took ~300s of a ~314s job, while the XeLaTeX run
      # itself takes 2s. So install BasicTeX plus only the packages the CV needs
      # (.github/texlive-packages.txt) and cache the result as a single tarball.
      # One large file restores far quicker than letting actions/cache walk tens
      # of thousands of small TeX files.
      #
      # Actions caches are branch-scoped with fallback to the default branch, so
      # the entry that matters is the one written by a gh-pages run: that one is
      # readable from every branch. A cache filled on a feature branch is only
      # visible to that branch, so the first run on a new branch may reinstall.
      - name: Restore cached TeX Live
        id: texlive-cache
        uses: actions/cache@v4
        with:
          path: ~/texlive-cv.tar.gz
          key: texlive-cv-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/texlive-packages.txt') }}

      - name: Install TeX Live
        if: steps.texlive-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          brew install --cask basictex
          export PATH="/Library/TeX/texbin:$PATH"

          packages="$(sed -e 's/#.*//' -e '/^[[:space:]]*$/d' .github/texlive-packages.txt | tr '\n' ' ')"
          echo "installing: $packages"
          sudo tlmgr update --self
          # shellcheck disable=SC2086
          sudo tlmgr install $packages

          sudo tar -czpf "$HOME/texlive-cv.tar.gz" -C / usr/local/texlive Library/TeX
          sudo chown "$(id -u):$(id -g)" "$HOME/texlive-cv.tar.gz"
          echo "cached tarball size: $(du -h "$HOME/texlive-cv.tar.gz" | cut -f1)"

      - name: Unpack cached TeX Live
        if: steps.texlive-cache.outputs.cache-hit == 'true'
        run: |
          set -euo pipefail
          sudo tar -xzpf "$HOME/texlive-cv.tar.gz" -C /

      - name: Put TeX Live on PATH
        run: |
          set -euo pipefail
          shopt -s nullglob

          # Locate the bin directory by testing for an executable xelatex. Note
          # that xelatex is a *symlink* to xetex, so a `find -type f` search
          # misses it; `-x`, which follows symlinks, is what works here.
          texbin=""
          for candidate in /usr/local/texlive/*/bin/*; do
            if [ -x "$candidate/xelatex" ]; then
              texbin="$candidate"
              break
            fi
          done
          # Fall back to the symlink farm BasicTeX sets up.
          if [ -z "$texbin" ] && [ -x /Library/TeX/texbin/xelatex ]; then
            texbin=/Library/TeX/texbin
          fi

          if [ -z "$texbin" ]; then
            echo "::error::xelatex not found. Contents follow for diagnosis."
            ls -la /usr/local/texlive || true
            for d in /usr/local/texlive/*/bin/*; do
              echo "--- $d"
              ls -la "$d" | head -20 || true
            done
            exit 1
          fi

          echo "using $texbin"
          "$texbin/xelatex" --version | head -1
          echo "$texbin" >> "$GITHUB_PATH"

      - name: Verify the CV fonts are visible to XeTeX
        run: |
          set -euo pipefail
          cat > font-probe.tex <<'PROBE'
          \documentclass{article}
          \usepackage{fontspec}
          \newcommand{\probe}[1]{\IfFontExistsTF{#1}{\typeout{FONT-OK: #1}}{\typeout{FONT-MISSING: #1}}}
          \begin{document}
          \probe{Hoefler Text}
          \probe{Hoefler Text Black}
          \probe{Hoefler Text Italic}
          \probe{Monaco}
          font probe
          \end{document}
          PROBE

          xelatex -interaction=nonstopmode -halt-on-error font-probe.tex >/dev/null
          grep 'FONT-OK\|FONT-MISSING' font-probe.log || true

          if grep -q 'FONT-MISSING' font-probe.log; then
            echo "::error::A font required by GraemeBlair-CV.tex is not installed on this runner."
            grep 'FONT-MISSING' font-probe.log
            exit 1
          fi

      - name: Compile GraemeBlair-CV.tex with XeLaTeX
        run: |
          set -euo pipefail
          latexmk -xelatex -halt-on-error -file-line-error -interaction=nonstopmode GraemeBlair-CV.tex

      - name: Verify the PDF was typeset in the intended fonts
        run: |
          set -euo pipefail
          # Guard against a silent regression to substituted fonts: if XeTeX had
          # fallen back, these font families would never have been created.
          for family in "HoeflerText(0)" "Monaco(0)"; do
            if ! grep -qF "Font family '${family}' created" GraemeBlair-CV.log; then
              echo "::error::GraemeBlair-CV.pdf was not typeset with ${family}."
              exit 1
            fi
            echo "ok: ${family}"
          done

          if [ ! -s GraemeBlair-CV.pdf ]; then
            echo "::error::GraemeBlair-CV.pdf is missing or empty."
            exit 1
          fi
          ls -l GraemeBlair-CV.pdf

      - name: Upload build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cv-pdf
          path: |
            GraemeBlair-CV.pdf
            GraemeBlair-CV.log
          if-no-files-found: warn
