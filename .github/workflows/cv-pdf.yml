name: Build and publish CV PDF

on:
  workflow_dispatch:
  push:
    paths:
      - GraemeBlair-CV.tex
      - .github/workflows/cv-pdf.yml

jobs:
  build-and-deploy:
    if: github.ref != 'refs/heads/gh-pages'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compile GraemeBlair-CV.tex with XeLaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: GraemeBlair-CV.tex
          latexmk_use_xelatex: true

      - name: Replace CV PDF on gh-pages
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          publish_dir="$(mktemp -d)"
          cleanup() {
            git worktree remove --force "$publish_dir" || true
            rm -rf "$publish_dir"
          }
          trap cleanup EXIT

          if git fetch --no-tags origin gh-pages:refs/remotes/origin/gh-pages; then
            git worktree add --detach "$publish_dir" refs/remotes/origin/gh-pages
          else
            git worktree add --detach "$publish_dir"
            (
              cd "$publish_dir"
              git checkout --orphan gh-pages
              git rm -rf . >/dev/null 2>&1 || true
            )
          fi

          cp GraemeBlair-CV.pdf "$publish_dir/GraemeBlair-CV.pdf"

          cd "$publish_dir"
          git add GraemeBlair-CV.pdf

          if git diff --cached --quiet; then
            echo "No PDF changes to commit."
            exit 0
          fi

          git commit -m "Update CV PDF from ${GITHUB_SHA}"
          git push origin HEAD:gh-pages
