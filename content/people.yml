# Advisees, staff and student researchers. One list feeds the site's Research
# group tab and the CV's "Advisees and placement" section.
#
# The two had drifted badly: nine people appeared in one and not the other, and
# eight placements were worded differently. Owner confirmed one list, everyone
# in both.
#
#   role       what the person did (controlled vocabulary below). A person can
#              hold more than one -- Valerie Wirtschafter was on a dissertation
#              committee AND a graduate student researcher, and the site said so.
#   status     current | alumni. "alumni" means they have moved on, which is
#              what `placement` records. Derived from nothing: it is stated,
#              because "has a placement" and "has finished" are not the same
#              thing and guessing wrong misstates someone's status in public.
#   placement  where they went next. Alumni only.
#   area,
#   dissertation
#              current dissertation students only; the site tabulates them.

roles:
  cochair:
    cv: dissertation co-chair
    site: Dissertation co-chair
    marker: co-chair          # the site appends "(co-chair)" to the name
  committee:
    cv: dissertation committee
    site: Dissertation committee
  staff:
    cv: staff researcher
    site: Staff researcher
  gsr:
    cv: graduate student researcher
    site: Graduate student researcher
  undergrad:
    cv: undergraduate researcher
    site: Undergraduate research assistant

