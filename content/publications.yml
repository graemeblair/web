- slug: leaders
  title: Trusted authorities can change minds and shift norms during conflict.
  venue: Proceedings of the National Academy of Sciences
  year: 2021
  column: policing
  cite: blair2021trusted
  authors:
  - Graeme Blair
  - Rebecca Littman
  - Elizabeth R. Nugent
  - Rebecca Wolfe
  - Mohammed Bukar
  - Benjamin Crisman
  - Anthony Etim
  - Chad Hazlett
  - Jiyoung Kim
  cv_detail: 118 (42)
  links:
  - label: PDF
    url: https://www.pnas.org/content/pnas/118/42/e2105570118.full.pdf
  - label: Cite
  - label: Policy brief
    url: https://www.poverty-action.org/study/improving-community-acceptance-returnees-boko-haram-nigeria-what-role-do-trusted-authorities
  - label: Appendices
    url: https://www.pnas.org/doi/suppl/10.1073/pnas.2105570118/suppl_file/pnas.2105570118.sapp.pdf
  - label: Preanalysis plan
    url: https://osf.io/km49f
  - label: Replication
    url: https://doi.org/10.17605/OSF.IO/PU5YR
  abstract: 'The reintegration of former members of violent extremist groups is a pressing policy
    challenge. Governments and policymakers often have to change minds among reticent populations
    and shift perceived community norms in order to pave the way for peaceful reintegration. How
    can they do so on a mass scale? Previous research shows that messages from trusted authorities
    can be effective in creating attitude change and shifting perceptions of social norms. In this
    study, we test whether messages from religious leaders – trusted authorities in many communities
    worldwide – can change minds and shift norms around an issue related to conflict resolution:
    the reintegration of former members of violent extremist groups. Our study takes place in Maiduguri,
    Nigeria, the birthplace of the violent extremist group Boko Haram. Participants were randomly
    assigned to listen to either a placebo radio message or to a treatment message from a religious
    leader emphasizing the importance of forgiveness, announcing the leader’s forgiveness of repentant
    fighters, and calling on followers to forgive. Participants were then asked about their attitudes,
    intended behaviors, and perceptions of social norms surrounding the reintegration of an ex-Boko
    Haram fighter. The religious leader message significantly increased support for reintegration
    and willingness to interact with the ex-fighter in social, political, and economic life (8 to
    10 percentage points). It also shifted people’s beliefs that others in their community were more
    supportive of reintegration (6 to 10 percentage points). Our findings suggest that trusted authorities
    such as religious leaders can be effective messengers for promoting peace.'
  authors_shown: 2
  kind: article
- slug: prices
  title: Do commodity price shocks cause armed conflict? Evidence from a meta-analysis.
  venue: American Political Science Review
  year: 2021
  column: policing
  cite: blair2021commodity
  authors:
  - Graeme Blair
  - Darin Christensen
  - Aaron Rudkin
  cv_detail: '115(2): 709-716'
  links:
  - label: PDF
    url: /papers/prices.pdf
  - label: Cite
  - label: Appendices
    url: https://graemeblair.com/papers/prices-supporting.pdf
  - label: Preanalysis plan
    url: http://www.egap.org/registration/4993
  - label: Replication
    url: https://doi.org/10.7910/DVN/BGCVOW
  abstract: 'Scholars of the resource curse argue that reliance on primary commodities destabilizes
    governments: price fluctuations generate windfalls or periods of austerity that provoke or intensify
    conflict. 350 quantitative studies test this claim, but prominent results point in different
    directions, making it difficult to discern which results reliably hold across contexts. We conduct
    a meta-analysis of 46 natural experiments that use difference-in-difference designs to estimate
    the causal effect of international commodity price changes on armed conflict. We show commodity
    price changes, on average, do not change conflict risks. However, this overall effect comprises
    cross-cutting effects by commodity type. In line with theory, we find price increases in labor-intensive
    agricultural commodities reduce conflict, while increases in the price of oil, a capital-intensive
    commodity, provoke conflict. We also find that prices changes for lootable artisanal minerals
    provoke conflict. Our meta-analysis consolidates existing evidence, but also highlights gaps
    for future research to fill.'
  kind: article
