  abstract: Social scientists have long sought to explain why people donate resources for the good
    of a community. Less experiment in Nigeria, we tested two campaigns that encouraged people to
    try reporting corruption by text message. Psychological theories about how to shift perceived
    norms and how to reduce barriers to action drove the design of each campaign. The first, a film
    featuring actors reporting corruption, and the second, a mass text message reducing the effort
    required to report, caused a total of 1181 people in 106 communities to text, including 241 people
    who sent concrete corruption reports. Psychological theories of social norms and behavior change
    can illuminate the early stages of the evolution of cooperation and collective action, when adoption
    is still relatively rare.
  kind: article
- slug: afghan
  title: 'Explaining support for combatants during wartime: A survey experiment in Afghanistan.'
  venue: American Political Science Review
  year: 2013
  column: policing
  cite: lyall2013explaining
  authors:
  - Jason Lyall
  - Graeme Blair
  - Kosuke Imai
  cv_detail: '107(4): 679-705'
  links:
  - label: PDF
    url: /papers/afghan.pdf
  - label: Cite
  - label: Replication
    url: http://hdl.handle.net/1902.1/20368
  award:
    text: MPSA Pi Sigma Alpha Best Article Award
    url: https://www.mpsanet.org/professional-resources/awards/award-recipient-archive/
  abstract: How are civilian attitudes toward combatants affected by wartime victimization? Are these
    effects conditional on which combatant inflicted the harm? We investigate the determinants of
    wartime civilian attitudes towards combatants using a survey experiment across 204 villages in
    five Pashtun-dominated provinces of Afghanistan—the heart of the Taliban insurgency. We use endorsement
    experiments to indirectly elicit truthful answers to sensitive questions about support for different
    combatants. We demonstrate that civilian attitudes are asymmetric in nature. Harm inflicted by
    the International Security Assistance Force (ISAF) is met with reduced support for ISAF and increased
    support for the Taliban, but Taliban-inflicted harm does not translate into greater ISAF support.
    We combine a multistage sampling design with hierarchical modeling to estimate ISAF and Taliban
    support at the individual, village, and district levels, permitting a more fine-grained analysis
    of wartime attitudes than previously possible.
  kind: article
- slug: pakistan
  title: 'Poverty and support for militant politics: Evidence from Pakistan.'
  venue: American Journal of Political Science
  year: 2013
  column: policing
  cite: blair2013poverty
  authors:
  - Graeme Blair
  - C. Christine Fair
  - Neil Malhotra
  - Jacob N. Shapiro
  cv_detail: '57(1): 30-48'
  links:
  - label: PDF
    url: /papers/pakistan.pdf
  - label: Cite
  - label: Replication
    url: http://hdl.handle.net/1902.1/17042
  - label: Appendices
    url: https://graemeblair.com/papers/pakistan-supporting.pdf
  abstract: Policy debates on strategies to end extremist violence frequently cite poverty as a root
    cause of support for the perpetrating groups. There is little evidence to support this contention,
    particularly in the Pakistani case. Pakistan’s urban poor are more exposed to the negative externalities
    of militant violence and may in fact be less supportive of the groups. To test these hypotheses
    we conducted a 6,000-person, nationally representative survey of Pakistanis that measured affect
    toward four militant organizations. By applying a novel measurement strategy, we mitigate the
    item nonresponse and social desirability biases that plagued previous studies due to the sensitive
    nature of militancy. Contrary to expectations, poor Pakistanis dislike militants more than middle-class
    citizens. This dislike is strongest among the urban poor, particularly those in violent districts,
    suggesting that exposure to terrorist attacks reduces support for militants. Long-standing arguments
    tying support for violent organizations to income may require substantial revision.
  kind: article
