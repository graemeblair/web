- slug: where
  title: 'The point of attack: Where and why does oil cause armed conflict in Africa?'
  venue: Journal of Politics
  column: policing
  cite: blair2022point
  authors:
  - Graeme Blair
  - Darin Christensen
  - Michael Gibilisco
  links:
  - label: PDF
    url: /papers/where.pdf
  - label: Cite
  - label: Replication
    url: https://doi.org/10.7910/DVN/L0USQU
  abstract: Prominent theories of conflict argue that belligerents fight to capture valuable rents
    (“prizes”) such as oil and other resources. Yet, we show that armed groups rarely attack sites
    with the most oil above or below ground, oil terminals and wells; only pipelines lead to conflict.
    To explain this finding, we integrate crisis bargaining and Blotto games. In our model, armed
    groups attack to steal oil and signal strength; anticipating the government’s defenses, these
    groups rarely target the biggest prizes, which are more fortified. Consistent with our model,
    we show that armed groups strategically randomize where they attack pipelines and that local
    and export prices for fuel have different effects on violence, because only export prices affect
    the government’s willingness to buy off would-be attackers. We revamp the prize logic for conflict
    to generate more accurate predictions and, in so doing, provide a rare real-world validation
    of a Blotto model.
  status: Accepted
  kind: article
- slug: helpdesks
  title: Accessing justice for survivors of violence against women.
  venue: Science
  year: 2022
  column: policing
  cite: blair2022accessing
  authors:
  - Graeme Blair
  - Nirvikar Jassal
  cv_detail: '377(6602): 150-151'
  links:
  - label: PDF
    url: /papers/helpdesks.pdf
  - label: Cite
  abstract: 'In an effort to increase women''s access to justice for crimes of violence against them,
    governments globally have implemented reforms including gender quotas in police hiring, women-run
    counseling centers, and mandates for women officers to exclusively handle cases of gender-based
    violence. The paper discusses the outcomes of such reforms, using a study conducted in Madhya
    Pradesh, India, as an example. This study introduced "women''s help desks" in police stations,
    spaces designated for women officers to interact with women complainants. The results were mixed:
    while more incidents were reported and some police attitudes shifted, the reforms didn''t significantly
    increase crime reporting by women or the arrest rates. The paper highlights the spectrum of gender-based
    reforms from integration (mixing women and men officers) to separation (exclusive spaces or stations
    for women), noting mixed results in effectiveness. It suggests that while certain reforms may
    increase report filings, they may not always result in arrests or change in police action, highlighting
    the complexity of addressing violence against women within the justice system.'
  kind: article
- slug: prospecting
  title: How does armed conflict shape investment? Evidence from the mining sector.
  venue: Journal of Politics
  year: 2022
  column: policing
  cite: blair2022does
  authors:
  - Graeme Blair
  - Darin Christensen
  - Valerie Wirtschafter
  cv_detail: '84(1): 116-133'
  links:
  - label: PDF
    url: /papers/prospecting.pdf
  - label: Cite
  - label: Appendices
    url: https://graemeblair.com/papers/prospecting-supporting.pdf
  - label: Replication
    url: http://hdl.handle.net/10.7910/DVN/8Y6BR1
  abstract: 'How does conflict affect firms'' investment decisions? Past results are mixed: a third
    of studies we reviewed report null or mixed correlations; some suggest conflict increases investment.
    We rationalize these results, arguing that armed conflict has divergent effects depending on
    firms’ exposure to violence. Conflict can deter investment by disrupting production or raising
    uncertainty. Yet, conflict can encourage investment by hampering government oversight. We argue
    each mechanism operates over different geographic extents. We use data from the mining sector
    to test these claims and report three main results. Firms operating at conflict sites dramatically
    reduce investments. By contrast, firms operating in territory surrounding conflict, but at a
    remove from fighting, actually increase investment. Firms far from violence see a small negative
    effect. These divergent responses cannot be inferred from aggregate flows: we show conflict depresses
    aggregate investment, but this reflects responses among firms far from fighting.'
  kind: article
- slug: mkiv
  title: Community policing does not build citizen trust in police or reduce crime in the Global
    South.
  venue: Science
  year: 2021
