  - label: PDF
    url: papers/fieldexp.pdf
  - label: Cite
  abstract: 'In this piece, we draw on our interdisciplinary experiences to develop a set of questions
    for RCT research in the Global South, suggesting ways to involve scholars and research staff
    who hail from the study site at every research stage. We maintain these interactions are not
    one-off exchanges, but rather opportunities to foster meaningful collaboration. We see such efforts
    as complementary to institutional efforts to recruit and retain graduate students and junior
    faculty from the Global South. We organize this piece by four distinct, yet interrelated research
    stages: idea generation, planning, implementation, and dissemination.'
