  award:
    text: Honorable Mention, APSA Comparative Politics Section Luebbert Best Article Prize
    url: https://www.guillermotoral.com/apsa_awards_2023.pdf
  abstract: Is it possible to reduce crime without exacerbating adversarial relationships between
    police and citizens? Community policing is a celebrated reform with that aim, now adopted on
    every continent. Yet, the evidence base is limited, studying reform components in isolation in
    a limited set of countries, and largely silent on citizen-police trust. We designed six field
    experiments with  Global South police agencies to study locally-designed models of community
    policing, with coordinated measures of crime and the attitudes and behaviors of citizens and
    police. In a preregistered meta-analysis, we find that these interventions led to mixed implementation,
    largely failed to improve citizen-police relations, and do not reduce crime. Structural changes
    may be required for incremental police reforms such as community policing to succeed.
