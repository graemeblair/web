- slug: ethicsScience
  title: Evidence needed for ethical social science.
  venue: Science
  year: 2023
  column: methods
  cite: littman2023evidence
  authors:
  - Rebecca Littman
  - Rebecca Wolfe
  - Graeme Blair
  - Sarah Ryan
  cv_detail: 379(6629):247
  links:
  - label: PDF
    url: https://www.science.org/doi/10.1126/science.adf8329
  - label: Cite
  abstract: The history of science is littered with violations of the human rights of research participants.
    One response has been regulation. In the United States, the Belmont Report lays out ethical principles
    for human subjects research, which form the foundation of modern-day institutional review boards.
    According to the Belmont Report, ethics committees and investigators need to determine whether
    the benefits of the research outweigh the costs and whether the costs unevenly burden particular
    groups. However, the assumptions underlying such assessments can be flawed. Without evidence
    about the causal effects of social science research on participant welfare, researchers risk
    causing unexpected harms or missing unexpected benefits.
  equal_authors: 3
  kind: article
- slug: fieldexp
  title: 'Field experiments in the Global South: Assessing risks, localizing benefits, and addressing
    positionality.'
  venue: 'PS: Political Science & Politics'
  year: 2022
  column: methods
