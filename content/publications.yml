- slug: contexts
  title: Experiments in multiple contexts.
  # The site called the volume the "Handbook of Experimental Political Science".
  # The CV and content/citations.bib both say "Advances in Experimental
  # Political Science", which is the book Druckman and Green actually edited.
  venue: Advances in Experimental Political Science
  year: 2021
  column: methods
  cite: blair2021conducting
  kind: chapter
  book: Advances in Experimental Political Science
  editors:
  - James N. Druckman
  - Donald P. Green
  publisher: Cambridge University Press
  publisher_place: Cambridge
  authors:
  - Graeme Blair
  - Gwyneth McClendon
  links:
  - label: PDF
    url: /papers/contexts.pdf
  - label: Cite
  abstract: 'In an effort to assess the generalizability of treatment effects across contexts, scholars
    (or teams of scholars) are increasingly conducting experiments around the same research questions
    in multiple country and subnational contexts. In this chapter, we categorize recent and ongoing
    efforts to conduct cross-context experiments into three types: “uncoordinated,” “coordinated,
    sequential,” and “coordinated, simultaneous.” We discuss some practical trade-offs across these
    types, arguing that coordinated cross-context designs offer the most promise for meta-analyses.
    We then draw attention to four areas in which the current approaches arguably all fall short
    in facilitating cumulative learning about treatment effects and treatment effect heterogeneity
    across contexts. We conclude by proposing some ways forward to continue improving our approach
    to learning about generalizability across contexts.'
- slug: sensitivity
  title: 'When to worry about sensitivity bias: A social reference theory and evidence from 30 years
    of list experiments.'
  venue: American Political Science Review
  year: 2020
  column: methods
  cite: blair2020worry
  authors:
  - Graeme Blair
  - Alexander Coppock
  - Margaret Moor
  cv_detail: '114(4): 1297-1315'
  links:
  - label: PDF
    url: papers/sensitivity.pdf
  - label: Cite
  - label: Replication
    url: https://doi.org/10.7910/DVN/YUXHZT
  - label: Appendices
    url: https://graemeblair.com/papers/sensitivity-supporting.pdf
  abstract: Eliciting honest answers to sensitive questions is frustrated if subjects withhold the
    truth for fear that others will judge or punish them. The resulting bias is commonly referred
    to as social desirability bias, a subset of what we label sensitivity bias. We make three contributions.
    First, we propose a social reference theory of sensitivity bias to structure expectations about
    survey responses on sensitive topics. Second, we explore the bias-variance trade-off inherent
    in the choice between direct and indirect measurement technologies. Third, to estimate the extent
    of sensitivity bias, we meta-analyze the set of published and unpublished list experiments (a.k.a.,
    the item count technique) conducted to date and compare the results with direct questions. We
    find that sensitivity biases are typically smaller than 10 percentage points and in some domains
    are approximately zero.
  kind: article
- slug: declare
  title: Declaring and diagnosing research designs.
  venue: American Political Science Review
  year: 2019
  column: methods
  cite: blair2019declaring
  authors:
  - Graeme Blair
  - Jasper Cooper
  - Alexander Coppock
  - Macartan Humphreys
  cv_detail: '113(3): 838-859'
  links:
  - label: PDF
    url: https://declaredesign.org/paper.pdf
  - label: Cite
  - label: Replication
    url: https://doi.org/10.7910/DVN/XYT1VB
  - label: Appendices
    url: https://declaredesign.org/paper_SI.pdf
  abstract: Researchers need to select high-quality research designs and communicate those designs
    clearly to readers. Both tasks are difficult. We provide a framework for formally “declaring”
    the analytically relevant features of a research design in a demonstrably complete manner, with
    applications to qualitative, quantitative, and mixed methods research. The approach to design
    declaration we describe requires defining a model of the world (M), an inquiry (I), a data strategy
    (D), and an answer strategy (A). Declaration of these features in code provides sufficient information
    for researchers and readers to use Monte Carlo techniques to diagnose properties such as power,
    bias, accuracy of qualitative causal inferences, and other “diagnosands.” Ex ante declarations
    can be used to improve designs and facilitate preregistration, analysis, and reconciliation of
    intended and actual analyses. Ex post declarations are useful for describing, sharing, reanalyzing,
    and critiquing existing designs. We provide open-source software, DeclareDesign, to implement
    the proposed approach.
  kind: article
- slug: listerror
  title: List experiments with measurement error.
  venue: Political Analysis
  year: 2019
  column: methods
  cite: blair2019list
  authors:
  - Graeme Blair
  - Winston Chou
  - Kosuke Imai
  cv_detail: '27(4): 455-480'
  links:
  - label: PDF
    url: papers/listerror.pdf
  - label: Cite
  - label: Replication
    url: https://doi.org/10.7910/DVN/L3GWNP
  abstract: Measurement error threatens the validity of survey research, especially when studying
    sensitive questions. Although list experiments can help discourage deliberate misreporting, they
    may also suffer from nonstrategic measurement error due to flawed implementation and respondents’
    inattention. Such error runs against the assumptions of the standard maximum likelihood regression
    (MLreg) estimator for list experiments and can result in misleading inferences, especially when
    the underlying sensitive trait is rare. We address this problem by providing new tools for diagnosing
    and mitigating measurement error in list experiments. First, we demonstrate that the nonlinear
    least squares regression (NLSreg) estimator proposed in Imai (2011) is robust to nonstrategic
    measurement error. Second, we offer a general model misspecification test to gauge the divergence
    of the MLreg and NLSreg estimates. Third, we show how to model measurement error directly, proposing
    new estimators that preserve the statistical efficiency of MLreg while improving robustness.
    Last, we revisit empirical studies shown to exhibit nonstrategic measurement error, and demonstrate
    that our tools readily diagnose and mitigate the bias. We conclude this article with a number
    of practical recommendations for applied researchers. The proposed methods are implemented through
    an open-source software package.
  kind: article
- slug: randresp
  title: Design and analysis of the randomized response technique.
  venue: Journal of the American Statistical Association
  year: 2015
  column: methods
  cite: blair2015design
  authors:
  - Graeme Blair
  - Kosuke Imai
  - Yang-Yang Zhou
  cv_detail: '110(511): 1304-1319'
  links:
  - label: PDF
    url: papers/randresp.pdf
  - label: Cite
  - label: Replication
    url: http://dx.doi.org/10.7910/DVN/AIO5BR
  abstract: About a half century ago, in 1965, Warner proposed the randomized response method as
    a survey technique to reduce potential bias due to nonresponse and social desirability when asking
    questions about sensitive behaviors and beliefs. This method asks respondents to use a randomization
    device, such as a coin flip, whose outcome is unobserved by the interviewer. By introducing random
    noise, the method conceals individual responses and protects respondent privacy. While numerous
    methodological advances have been made, we find surprisingly few applications of this promising
    survey technique. In this article, we address this gap by (1) reviewing standard designs available
    to applied researchers, (2) developing various multivariate regression techniques for substantive
    analyses, (3) proposing power analyses to help improve research designs, (4) presenting new robust
    designs that are based on less stringent assumptions than those of the standard designs, and
    (5) making all described methods available through open-source software. We illustrate some of
    these methods with an original survey about militant groups in Nigeria.
  kind: article
- slug: listendorse
  title: 'Comparing and combining list and endorsement experiments: Evidence from Afghanistan.'
  venue: American Journal of Political Science
  year: 2014
  column: methods
  cite: blair2014comparing
  authors:
  - Graeme Blair
  - Kosuke Imai
  - Jason Lyall
  cv_detail: '58(4): 1043-1063'
  links:
  - label: PDF
    url: papers/listendorse.pdf
  - label: Cite
  - label: Replication
    url: http://hdl.handle.net/1902.1/21243
  abstract: 'List and endorsement experiments are becoming increasingly popular among social scientists
    as indirect survey techniques for sensitive questions. When studying issues such as racial prejudice
    and support for militant groups, these survey methodologies may improve the validity of measurements
    by reducing nonresponse and social desirability biases. We develop a statistical test and multivariate
    regression models for comparing and combining the results from list and endorsement experiments.
    We demonstrate that when carefully designed and analyzed, the two survey experiments can produce
    substantively similar empirical findings. Such agreement is shown to be possible even when these
    experiments are applied to one of the most challenging research environments: contemporary Afghanistan.
    We find that both experiments uncover similar patterns of support for the International Security
    Assistance Force (ISAF) among Pashtun respondents. Our findings suggest that multiple measurement
    strategies can enhance the credibility of empirical conclusions. Open-source software is available
    for implementing the proposed methods.'
  kind: article
- slug: list
  title: Statistical analysis of list experiments.
  venue: Political Analysis
  year: 2012
  column: methods
  cite: blair2012statistical
  authors:
  - Graeme Blair
  - Kosuke Imai
  cv_detail: '20: 47-77'
  links:
  - label: PDF
    url: papers/list.pdf
  - label: Cite
  - label: Replication
    url: http://hdl.handle.net/1902.1/17040
  - label: Appendices
    url: https://graemeblair.com/papers/list-supporting.pdf
  abstract: The validity of empirical research often relies upon the accuracy of self-reported behavior
    and beliefs. Yet eliciting truthful answers in surveys is challenging, especially when studying
    sensitive issues such as racial prejudice, corruption, and support for militant groups. List
    experiments have attracted much attention recently as a potential solution to this measurement
    problem. Many researchers, however, have used a simple difference-in-means estimator, which prevents
    the efficient examination of multivariate relationships between respondents’ characteristics
    and their responses to sensitive items. Moreover, no systematic means exists to investigate the
    role of underlying assumptions. We fill these gaps by developing a set of new statistical methods
    for list experiments. We identify the commonly invoked assumptions, propose new multivariate
    regression estimators, and develop methods to detect and adjust for potential violations of key
    assumptions. For empirical illustration, we analyze list experiments concerning racial prejudice.
    Open-source software is made available to implement the proposed methodology.
  kind: article
