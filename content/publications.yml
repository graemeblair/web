    url: https://www.cambridge.org/us/universitypress/subjects/politics-international-relations/comparative-politics/crime-insecurity-and-community-policing-experiments-building-trust?format=PB
  - label: Amazon
    url: https://www.amazon.com/Crime-Insecurity-Community-Policing-Experiments/dp/1009235877?dib_tag=se&dib=eyJ2IjoiMSJ9.6rbh3P-wXuZ-luVM9E6dnWb2NrhdM-vhMpzbzA94vbsPQvUv0oXwucbr2_OzlWhKBi09VzpuC1qNASKr5yj5biI_C_jj7MjE3C1xZp1d1NY.f3tdoKIbl33vgjPKfFjfhYMvlruH0berQ_q9sMZJ1Gs&qid=1718479889&sr=8-2
  - label: Cite
  abstract: How can societies effectively reduce crime without exacerbating adversarial relationships
    between the police and citizens? In recent decades, perhaps the most celebrated innovation in
    police reform has been the introduction of community policing, where citizens are involved in
    building channels of dialogue and improving police-citizen collaboration. Despite the widespread
    adoption of community policing in the United States and increasingly in the developing world,
    there is still limited credible evidence about whether it realistically increases trust in the
    police or reduces crime. Through simultaneously coordinated field experiments in a diversity
    of political contexts, this book presents the outcome of a major research initiative into the
    efficacy of community policing. Scholars from around the world uncover whether, and under what
    conditions, this highly influential strategy for tackling crime and insecurity is effective.
    With its highly innovative approach to cumulative learning, this project represents a new frontier
    in the study of police reform.
