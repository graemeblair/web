# Page chrome: <head>, third-party assets, and the tab list.
#
# The tab list drives BOTH the nav and the tab panes -- see
# templates/html/index.html.j2. Today those are two hand-maintained parallel
# lists in index.html (:143-165 and :167-1035); deriving them from one list is
# what makes them structurally unable to disagree.

title: Graeme Blair - Professor of Political Science at UCLA

# Google Fonts is fetched twice on purpose: preconnect warms the connection,
# then the stylesheet loads at high priority.
fonts_url: https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,400;0,700;1,400;1,700&family=Merriweather:ital@0;1&display=swap

preload_image: https://graemeblair.com/img/graeme.webp

local_css:
  - css/academicons.min.css
  - css/citation-highlight.css

# Third-party assets. Version and Subresource Integrity hash live on the same
# record so they cannot drift apart -- a bumped version with a stale hash
# silently breaks the asset.
#
# NOTE: fontawesome and citation_js carry no integrity hash today. Adding one is
# a real improvement but a behavior change (a wrong hash kills the Cite button
# outright), so it is a follow-up, verified under Gate 3 -- not part of the
# migration.
externals:
  fontawesome:
    src: https://kit.fontawesome.com/c353c259e6.js
    crossorigin: anonymous
    flags: [async]
  bootstrap_css:
    href: https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css
    rel: stylesheet
    integrity: sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65
    crossorigin: anonymous
  bootstrap_js:
    src: https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js
    integrity: sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4
    crossorigin: anonymous
  citation_js:
    src: https://cdn.jsdelivr.net/npm/citation-js@0.7.9/build/citation.min.js
    flags: [defer]

tabs:
  - {id: research, label: Writing,        icon: fa-solid fa-book}
  - {id: data,     label: Data,           icon: fa-solid fa-database}
  - {id: software, label: Software,       icon: fa-solid fa-magnifying-glass-chart}
  - {id: expert,   label: Expert work,    icon: fa-solid fa-scale-balanced}
  - {id: group,    label: Research group, icon: fa-solid fa-people-group}
  - {id: teaching, label: Teaching,       icon: fa-solid fa-chalkboard-user}
  - {id: students, label: For students,   icon: fa-solid fa-circle-info}
