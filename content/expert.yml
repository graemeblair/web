# Expert work in immigration litigation.
#
# The two targets present this very differently and both presentations are
# wanted: the site groups cases by the legal theory at issue and traces each
# case through its postures -- district court, then appeal -- while the CV is
# one flat reverse-chronological list with one line per declaration or brief.
# Both are derived from the same `cases` list. A case holds one stage per
# posture; the site renders the case once with its stages in chronological
# order, and the CV flattens every stage back out and sorts by `date`. Adding
# a posture means adding one stage to the case it belongs to.
#
# A stage's `caption` is the name the case carried at that posture, where it
# differs from the case's name -- Khalil was Khalil v. Joyce in the district
# court and Khalil v. Trump on appeal. The CV lists each posture under its own
# caption, as it always has; the site notes the earlier caption on the stage.
#
# On the site, consecutive stages in the same court share one court line, with
# one sub-bullet per stage (D.N.N.'s two district-court motions); the CV still
# renders each stage as its own line.
#
# Roles are a controlled vocabulary rather than free text. Each phrasing is
# written once, below, so every matter with the same role reads identically --
# which was not true before: Stanford Daily said "Expert declaration for amicus
# brief" where its eleven siblings all said "(for amicus brief)".

intro: >-
  I provide data analysis for strategic litigation on immigration enforcement in
  the United States. Below are selected cases I have worked on.

# One phrasing per role, shared by the site and the CV, naming the posture in
# comma style -- "Declaration, amicus brief". The two targets used to word
# these differently (site "Expert report" where the CV said "Expert
# declaration (for ...)"); they were unified on the site's wording.
roles:
  declaration: Declaration
  declaration_amicus: Declaration, amicus brief
  report_pi: Expert report, motion for preliminary injunction
  report_enforce_pi: Expert report, motion to enforce preliminary injunction
  declaration_class_cert: Declaration, motion to certify class
  declaration_class_cert_reply: Declaration, reply in support of motion to certify class
  consulting_pi: Consulting, motion for preliminary injunction
  # Consulting not tied to a particular motion, so no posture (Moreno).
  consulting: Consulting
  consultant: Statistical consultant
  # Calderon was a solo brief; Genalo has fourteen signatories, so the plural.
  amicus_brief: Brief of amicus curiae
  amici_brief: Brief of amici curiae

groups:
  - id: mandatory-detention
    heading: Prolonged mandatory detention without a bond hearing (8 U.S.C. §1226(c))
  - id: courthouse
    heading: Courthouse arrests
  - id: holdrooms
    heading: Overcrowding in ICE field office hold rooms
  - id: foreign-policy
    heading: Use of foreign policy deportability grounds (8 U.S.C. §1227(a)(4)(C))
    note: >-
      Related article in Slate, "[link:https://slate.com/news-and-politics/2025/04/free-mahmoud-khalil-detention-doj-trump-law.html]The
      Bizarre Legal Theory Behind Mahmoud Khalil's Detention.[/link]"
      (with Amber Qureshi, Fatma Marouf, and Elora Mukherjee)
  - id: street
    heading: Warrantless street arrests
  - id: cat
    heading: Evidence on torture risk in Convention Against Torture cases

# Every ordering is computed rather than maintained by hand: the site orders
# groups by the latest stage of any case in them and cases within a group by
# their latest stage, both newest first, and the CV sorts the flattened stages
# by `date`. One thing IS order-sensitive here: the sorts are stable, so
# groups or stages sharing a month keep this file's order. Among groups, the
# Genalo, hold-room, and street-arrest groups all last moved in September
# 2026, which is why the `groups` list above has them in that order. Among CV
# stages, the ties are Genalo, D.N.N.'s second enforcement report, and
# Guzmán (September 2026), D.N.N.'s first and Khalil's Fifth Circuit
# declaration (August 2026), the sentencing project and D.N.N. (December
# 2025), Stanford Daily and Khan Suri (October 2025), Mahdawi's appeal and
# Vasquez Perdomo's two declarations (August 2025), and Chung and Khalil's
# district declaration (March 2025) -- each set sits here in the CV's
# long-standing order, which is why Khalil is listed after Chung despite its
# later appellate stage.
cases:
  # Supreme Court No. 25-886, docketed as Genalo v. Black; the Court granted
  # certiorari only as to G.M.'s case and later let him abbreviate his name.
  # Brief of amici curiae Data and Policy Analysts in support of respondent,
  # fourteen amici including both co-directors of the Deportation Data Project.
  # Argument is set for October 13, 2026; add the opinion to `documents` when
  # it issues.
  - case: Genalo v. G.M.
    group: mandatory-detention
    stages:
      - role: amici_brief
        date: 2026-09
        court: Supreme Court of the United States
        documents:
          - {label: Amicus brief, url: "https://www.supremecourt.gov/DocketPDF/25/25-886/423419/20260908155157217_Genalo%20-%20Data%20Analysts%20Amicus%20ISO%20Respondent.pdf", cv_link: true}

