        court: U.S. District Court for the Southern District of Indiana
        documents:
          - {label: Order, url: "https://www.aclu-il.org/app/uploads/2026/06/55-Order-Releasing-Salah.pdf"}

  # Putative class action filed September 9, 2026, No. 1:26-cv-03579 (D. Md.).
