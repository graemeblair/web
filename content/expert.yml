# Expert work in immigration litigation.
#
# The two targets present this very differently and both presentations are
# wanted: the site groups matters by the legal theory at issue and links the
# resulting documents, while the CV is one flat reverse-chronological list. Both
# are derived from the same `matters` list -- `group` drives the site's sections
# and `date` drives the ordering, so adding a case means adding it once.
#
# Roles are a controlled vocabulary rather than free text. Each phrasing is
# written once, below, so every matter with the same role reads identically --
# which was not true before: Stanford Daily said "Expert declaration for amicus
# brief" where its eleven siblings all said "(for amicus brief)".

intro: >-
  I provide data analysis for strategic litigation on immigration enforcement in
  the United States. Below are selected cases I have worked on.

roles:
  declaration:
    site: Declaration
    cv: Expert declaration
  declaration_amicus:
    site: Declaration
    cv: Expert declaration (for amicus brief)
  declaration_pi:
    site: Expert report
    cv: Expert declaration (for motion for preliminary injunction)
  declarations_class_cert:
    site: Declarations (for motion to certify class and reply in support of motion to certify class)
    cv: Expert declarations (for motion to certify class and reply in support of motion to certify class)
  consulting_pi:
    site: Consulting
    cv: Statistical consulting (during motion for preliminary injunction)
  consultant:
    site: Statistical consultant
    cv: Statistical consultant
  amicus_brief:
    site: Brief of amicus curiae
    cv: Brief of amicus curiae

groups:
  - id: courthouse
    heading: Courthouse arrests
  - id: holdrooms
    heading: Overcrowding in ICE field office hold rooms
  - id: foreign-policy
    heading: Use of foreign policy deportability grounds (8 U.S.C. §1227(a)(4)(C))
    note: >-
      Related article in Slate, "[link:https://slate.com/news-and-politics/2025/04/free-mahmoud-khalil-detention-doj-trump-law.html]The
      Bizarre Legal Theory Behind Mahmoud Khalil's Detention.[/link]"
      (with Amber Qureshi, Fatma Marouf, and Elora Mukherjee)
  - id: street
    heading: Warrantless street arrests
  - id: cat
    heading: Evidence on torture risk in Convention Against Torture cases

# Sorted by `date` descending for both targets, so the CV's ordering is computed
# rather than maintained by hand.
matters:
